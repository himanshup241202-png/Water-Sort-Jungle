name: Water Sort Jungle - Indus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # FIND ANDROID PROJECT
      # ==============================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "android-wrapper/settings.gradle" ] && \
             [ -f "android-wrapper/app/build.gradle" ]; then
            PROJECT_DIR="android-wrapper"
          fi

          if [ -z "$PROJECT_DIR" ] && \
             [ -f "settings.gradle" ] && \
             [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          fi

          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              ! -path "./.git/*" \
              | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found."
              exit 1
            fi

            echo "ZIP: $ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      # ==============================
      # JAVA 17
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name "sdkmanager" \
            -print -quit || true)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ==============================
      # GRADLE
      # ==============================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==============================
      # CLEAN
      # ==============================
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon


      # ==============================
      # BUILD RELEASE APK
      # IMPORTANT:
      # NO build.gradle MODIFICATION
      # ==============================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            --no-build-cache


      # ==============================
      # FIND APK
      # ==============================
      - name: Find release APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "APK FOUND:"
          echo "$APK"


      # ==============================
      # CREATE SIGNING KEY
      # ==============================
      - name: Create APK signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair -v \
            -keystore signing/water-sort-jungle.jks \
            -storepass WaterSortJungleStore \
            -keypass WaterSortJungleKey \
            -alias watersortjungle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"


      # ==============================
      # ALIGN APK
      # ==============================
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          mkdir -p signed

          "$ZIPALIGN" -f -p 4 \
            "$APK_PATH" \
            signed/Water-Sort-Jungle-aligned.apk


      # ==============================
      # SIGN APK
      # ==============================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks signing/water-sort-jungle.jks \
            --ks-pass pass:WaterSortJungleStore \
            --key-pass pass:WaterSortJungleKey \
            --ks-key-alias watersortjungle \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed/Water-Sort-Jungle-Indus.apk \
            signed/Water-Sort-Jungle-aligned.apk


      # ==============================
      # VERIFY APK
      # ==============================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          FINAL="signed/Water-Sort-Jungle-Indus.apk"

          test -s "$FINAL"

          echo "Checking APK structure..."
          unzip -t "$FINAL" >/dev/null

          echo "Checking Android signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$FINAL"

          echo "================================"
          echo "APK FORMAT    : OK"
          echo "APK SIGNATURE : OK"
          echo "================================"


      # ==============================
      # FINAL ARTIFACT
      # ==============================
      - name: Upload Indus APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Indus-APK
          path: signed/Water-Sort-Jungle-Indus.apk
          if-no-files-found: error
          retention-days: 30
