name: Water Sort Jungle - Indus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. CHECKOUT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4


      # ==============================
      # 2. FIND ANDROID PROJECT
      # ==============================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Your ZIP/project structure
          if [ -f "android-wrapper/settings.gradle" ] && \
             [ -f "android-wrapper/app/build.gradle" ]; then
            PROJECT_DIR="android-wrapper"
          fi

          # Root project
          if [ -z "$PROJECT_DIR" ] && \
             [ -f "settings.gradle" ] && \
             [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          fi

          # Search ZIP if project is not already extracted
          if [ -z "$PROJECT_DIR" ]; then

            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              ! -path "./.git/*" \
              | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP not found."
              exit 1
            fi

            echo "Found ZIP: $ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT_DIR"
          echo "======================================"


      # ==============================
      # 3. JAVA 17
      # ==============================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # 4. ANDROID SDK
      # NO setup-android@v3
      # ==============================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK path not found."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name "sdkmanager" \
              -print -quit)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"


      # ==============================
      # 5. GRADLE 8.10.2
      # ==============================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ==============================
      # 6. FIX KOTLIN DUPLICATE CLASSES
      # ==============================
      - name: Fix Kotlin dependency conflicts
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])

          candidates = [
              project / "build.gradle",
              project / "app" / "build.gradle"
          ]

          root = project / "build.gradle"

          if root.exists():
              text = root.read_text()

              fix = r'''

          // Kotlin dependency compatibility
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }
          '''

              if "Kotlin dependency compatibility" not in text:
                  text += fix
                  root.write_text(text)

          print("Kotlin dependency compatibility configured.")
          PY


      # ==============================
      # 7. CREATE RELEASE KEY
      # ==============================
      - name: Create release signing key
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/signing"

          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/signing/water-sort-jungle-release.jks" \
            -storepass "WaterSortJungleStore" \
            -keypass "WaterSortJungleKey" \
            -alias "watersortjungle" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"

          echo "RELEASE_STORE_PASSWORD=WaterSortJungleStore" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=watersortjungle" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=WaterSortJungleKey" >> "$GITHUB_ENV"


      # ==============================
      # 8. ADD RELEASE SIGNING
      # ==============================
      - name: Configure APK signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle"

          text = gradle_file.read_text()

          if "Water Sort Jungle Indus Signing" not in text:

              text += r'''

          // Water Sort Jungle Indus Signing
          android {
              signingConfigs {
                  indusRelease {
                      storeFile file("../signing/water-sort-jungle-release.jks")
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.indusRelease
                  }
              }
          }
          '''

              gradle_file.write_text(text)

          print("Release signing configured.")
          PY


      # ==============================
      # 9. CLEAN
      # ==============================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon


      # ==============================
      # 10. BUILD RELEASE APK
      # ==============================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace


      # ==============================
      # 11. FIND APK
      # ==============================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APK GENERATED SUCCESSFULLY"
          echo "$APK"
          echo "======================================"


      # ==============================
      # 12. VERIFY APK FORMAT
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Checking APK file..."

          test -s "$APK_PATH"

          echo "Checking ZIP/APK structure..."
          unzip -t "$APK_PATH" >/dev/null

          echo "Checking Android signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo "======================================"
          echo "APK FORMAT       : OK"
          echo "APK SIGNATURE    : OK"
          echo "APK VERIFICATION : OK"
          echo "======================================"


      # ==============================
      # 13. PREPARE INDUS APK
      # ==============================
      - name: Prepare Indus APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$APK_PATH" \
            "artifacts/Water-Sort-Jungle-Indus.apk"

          echo "Final APK:"
          ls -lh "artifacts/Water-Sort-Jungle-Indus.apk"

          file "artifacts/Water-Sort-Jungle-Indus.apk"


      # ==============================
      # 14. UPLOAD APK
      # ==============================
      - name: Upload Indus APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Indus-APK
          path: artifacts/Water-Sort-Jungle-Indus.apk
          if-no-files-found: error
          retention-days: 30
