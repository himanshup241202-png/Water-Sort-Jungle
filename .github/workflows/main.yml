name: Water Sort Jungle - Indus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # FIND ANDROID PROJECT
      # =========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT="."
          fi

          if [ -z "$PROJECT" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              ! -path "./.git/*" \
              | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project ZIP not found."
              exit 1
            fi

            echo "Project ZIP: $ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID PROJECT FOUND"
          echo "$PROJECT"
          echo "======================================"


      # =========================================
      # JAVA 17
      # =========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # GRADLE
      # =========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # =========================================
      # ANDROID SDK
      # =========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -print -quit || true)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0"
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      # =========================================
      # CLEAN
      # =========================================
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon


      # =========================================
      # BUILD RELEASE APK
      # =========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace


      # =========================================
      # FIND RELEASE APK
      # =========================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "SOURCE_APK=$APK" >> "$GITHUB_ENV"

          echo "SOURCE APK:"
          echo "$APK"


      # =========================================
      # CREATE RELEASE KEY
      # =========================================
      - name: Create signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair -v \
            -keystore signing/water-sort-jungle.jks \
            -storetype JKS \
            -storepass WaterSortJungleStore \
            -keypass WaterSortJungleKey \
            -alias watersortjungle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, ST=Uttar Pradesh, C=IN"

          echo "Signing key created."


      # =========================================
      # ZIPALIGN FIRST
      # =========================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          mkdir -p aligned

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$SOURCE_APK" \
            aligned/Water-Sort-Jungle-aligned.apk

          echo "APK zipaligned successfully."


      # =========================================
      # SIGN WITH V1 + V2 ONLY
      # =========================================
      - name: Sign APK for Indus
        shell: bash
        run: |
          set -e

          mkdir -p final

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks signing/water-sort-jungle.jks \
            --ks-key-alias watersortjungle \
            --ks-pass pass:WaterSortJungleStore \
            --key-pass pass:WaterSortJungleKey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out final/Water-Sort-Jungle-Indus.apk \
            aligned/Water-Sort-Jungle-aligned.apk

          echo "Indus-compatible APK signing completed."


      # =========================================
      # VERIFY APK
      # =========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="final/Water-Sort-Jungle-Indus.apk"

          echo "Checking file..."

          test -s "$APK"

          echo "Checking ZIP structure..."

          unzip -t "$APK" >/dev/null

          echo "Checking Android APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "Checking APK package..."

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK" > /tmp/apk-info.txt

          echo "APK package information:"
          head -20 /tmp/apk-info.txt

          echo "======================================"
          echo "APK FILE       : VALID"
          echo "ZIP STRUCTURE  : VALID"
          echo "SIGNATURE      : VALID"
          echo "ANDROID APK    : VALID"
          echo "======================================"


      # =========================================
      # FINAL APK INFO
      # =========================================
      - name: Show final APK
        shell: bash
        run: |
          set -e

          ls -lh final/Water-Sort-Jungle-Indus.apk

          file final/Water-Sort-Jungle-Indus.apk

          unzip -l final/Water-Sort-Jungle-Indus.apk | head -20


      # =========================================
      # UPLOAD ONLY APK
      # =========================================
      - name: Upload Indus APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Indus-APK
          path: final/Water-Sort-Jungle-Indus.apk
          if-no-files-found: error
          retention-days: 30
