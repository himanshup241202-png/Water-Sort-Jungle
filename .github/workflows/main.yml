name: Build Water Sort Jungle - Indus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        shell: bash
        run: |
          set -e

          # First check if android-wrapper is already extracted
          if [ -f "android-wrapper/settings.gradle" ] && \
             [ -f "android-wrapper/app/build.gradle" ]; then

            PROJECT_DIR="android-wrapper"

          else
            # If only the ZIP was uploaded, extract it
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' \
              ! -path './.git/*' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or ZIP not found."
              exit 1
            fi

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR="$(find extracted -type f \
              -name settings.gradle -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle not found."
              exit 1
            fi
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create release signing key
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/signing"

          keytool -genkeypair \
            -keystore "$PROJECT_DIR/signing/water-sort-jungle-release.keystore" \
            -storepass "WaterSortJungleStore" \
            -keypass "WaterSortJungleKey" \
            -alias "watersortjungle" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, S=UP, C=IN"

          echo "RELEASE_STORE_PASSWORD=WaterSortJungleStore" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=watersortjungle" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=WaterSortJungleKey" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle"

          text = gradle_file.read_text()

          if "signingConfigs" not in text:
              text = text.replace(
                  "android {",
                  """android {

              signingConfigs {
                  release {
                      storeFile file("../signing/water-sort-jungle-release.keystore")
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }"""
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "versionName '1.0'",
                  """versionName '1.0'
              signingConfig signingConfigs.release"""
              )

          gradle_file.write_text(text)

          print("Release signing configured.")
          PY

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Verify APK format
        shell: bash
        run: |
          set -e

          echo "Checking APK ZIP structure..."

          unzip -t "$APK_PATH" >/dev/null

          echo "Checking APK signature..."

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK_PATH"

          echo "Checking APK file type..."

          file "$APK_PATH"

          echo "APK verification completed successfully."

      - name: Prepare Indus APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp "$APK_PATH" \
            "artifacts/Water-Sort-Jungle-Indus.apk"

          echo "Final APK:"
          ls -lh "artifacts/Water-Sort-Jungle-Indus.apk"

      - name: Upload Indus APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Indus-APK
          path: artifacts/Water-Sort-Jungle-Indus.apk
          if-no-files-found: error
          retention-days: 30
