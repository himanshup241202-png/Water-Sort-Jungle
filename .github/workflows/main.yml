name: Water Sort Jungle - Indus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------
      # FIND ANDROID PROJECT
      # --------------------------------
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT="."
          fi

          if [ -z "$PROJECT" ]; then
            ZIP=$(find . -maxdepth 3 -type f -name "*.zip" \
              ! -path "./.git/*" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Android project ZIP not found."
              exit 1
            fi

            echo "Found project ZIP: $ZIP"

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP" -d extracted

            PROJECT=$(find extracted \
              -type f \
              -name "settings.gradle" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT FOUND"
          echo "$PROJECT"
          echo "================================"


      # --------------------------------
      # JAVA 17
      # --------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------
      # GRADLE
      # --------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # --------------------------------
      # ANDROID SDK
      # --------------------------------
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -print -quit || true)

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;35.0.0"
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"


      # --------------------------------
      # CLEAN
      # --------------------------------
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon


      # --------------------------------
      # BUILD RELEASE APK
      # --------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace


      # --------------------------------
      # LOCATE APK
      # --------------------------------
      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep "/release/" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "SOURCE_APK=$APK" >> "$GITHUB_ENV"

          echo "Release APK:"
          echo "$APK"


      # --------------------------------
      # CREATE SIGNING KEY
      # --------------------------------
      - name: Create signing key
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair -v \
            -keystore signing/water-sort-jungle.jks \
            -storetype JKS \
            -storepass WaterSortJungleStore \
            -keypass WaterSortJungleKey \
            -alias watersortjungle \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Water Sort Jungle, OU=Game, O=Water Sort Jungle, L=India, ST=UP, C=IN"

          echo "Signing key created."


      # --------------------------------
      # SIGN APK
      # --------------------------------
      - name: Sign APK
        shell: bash
        run: |
          set -e

          mkdir -p final

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks signing/water-sort-jungle.jks \
            --ks-key-alias watersortjungle \
            --ks-pass pass:WaterSortJungleStore \
            --key-pass pass:WaterSortJungleKey \
            --out final/Water-Sort-Jungle-Indus.apk \
            "$SOURCE_APK"

          echo "APK signed successfully."


      # --------------------------------
      # VERIFY APK
      # --------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="final/Water-Sort-Jungle-Indus.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Final APK is missing."
            exit 1
          fi

          echo "Checking APK ZIP format..."
          unzip -t "$APK" >/dev/null

          echo "Checking Android signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo "========================================"
          echo "APK FORMAT    : VALID"
          echo "APK SIGNATURE : VALID"
          echo "========================================"


      # --------------------------------
      # UPLOAD ONLY APK
      # --------------------------------
      - name: Upload Indus APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Sort-Jungle-Indus-APK
          path: final/Water-Sort-Jungle-Indus.apk
          if-no-files-found: error
          retention-days: 30
